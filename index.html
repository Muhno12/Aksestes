<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Kuota IM3 / Indosat</title>

<style>
:root{
  --text:#111827;
  --muted:#374151;

  --card:rgba(240,240,240,.72);
  --card-soft:rgba(245,245,245,.55);

  --orange:#f59e0b;
  --ok:#16a34a;
  --bad:#dc2626;
  --warn:#d97706;

  --shadow:0 20px 60px rgba(0,0,0,.25);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  color:var(--text);

  background:
    linear-gradient(rgba(255,255,255,.02),rgba(255,255,255,.10)),
    url("https://buyer.duniadigitalsb.my.id/uploads/logo/circelcuanmvlogo.png");

  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;

  filter:contrast(1.2) saturate(1.25);

  min-height:100vh;
}

.wrap{max-width:560px;margin:auto;padding:20px 14px}

.card{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}

.logoBox{text-align:center;margin-bottom:10px}
.logoBox img{width:90px}

.title{
  text-align:center;
  font-weight:1000;
  font-size:28px;
  margin-bottom:16px;
  line-height:1.1;
}

.label{font-weight:900;margin-bottom:8px}

input{
  width:100%;
  height:48px;
  border-radius:14px;
  border:1px solid rgba(0,0,0,.15);
  background:rgba(255,255,255,.75);
  color:#111;
  padding:0 14px;
  font-size:15px;
  outline:none;
}
input::placeholder{color:#6b7280}

button{
  width:100%;
  height:52px;
  margin-top:14px;
  border-radius:14px;
  border:none;
  background:linear-gradient(#ffb020,#f59e0b);
  font-weight:1000;
  cursor:pointer;
  color:#111;
}
button:disabled{opacity:.6;cursor:not-allowed}

.dash{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.kpi{
  background:var(--card-soft);
  border-radius:16px;
  padding:12px;
}

.klabel{
  font-size:12px;
  color:#4b5563;
  font-weight:800;
}

.kval{
  font-weight:1000;
  margin-top:6px;
  word-break:break-word;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  background:rgba(0,0,0,.05);
}

.dot{width:8px;height:8px;border-radius:50%}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.dot.warn{background:var(--warn)}

.resultWrap{
  margin-top:14px;
  background:var(--card-soft);
  border-radius:16px;
  padding:12px;
}

.resultHead{
  font-weight:1000;
  margin-bottom:10px;
  display:flex;
  gap:8px;
  align-items:center;
}

.paper{
  width:18px;
  height:18px;
  border-radius:5px;
  background:rgba(0,0,0,.15);
}

.empty{
  border:1px dashed rgba(0,0,0,.25);
  padding:12px;
  border-radius:12px;
  color:#374151;
}

/* ACCORDION */
.pkg{
  background:rgba(250,250,250,.75);
  border-radius:14px;
  margin-top:10px;
  overflow:hidden;
  border:1px solid rgba(0,0,0,.12);
}

.pkgHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  cursor:pointer;
  font-weight:1000;
  background:rgba(245,158,11,.18);
  user-select:none;
}

.chev{
  font-size:18px;
  transition:.12s ease;
  transform:rotate(0deg);
}

.pkg.open .chev{transform:rotate(90deg)}

.pkgBody{display:none;padding:12px}
.pkg.open .pkgBody{display:block}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px dashed rgba(0,0,0,.2);
}
.item:last-child{border-bottom:0}

.iname{font-weight:900;font-size:13px}
.iexp{font-size:12px;color:#6b7280;margin-top:4px}
.irem{font-weight:1000;white-space:nowrap}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div class="logoBox">
      <img src="https://buyer.duniadigitalsb.my.id/uploads/logo/indosat.png" alt="IM3">
    </div>

    <div class="title">CEK KUOTA<br>IM3 / INDOSAT</div>

    <div class="label">Nomor IM3 / Indosat</div>
    <input id="msisdn" placeholder="0857xxxx / 62857xxx" inputmode="numeric" autocomplete="off">
    <button id="cekBtn" disabled>Cek Kuota</button>

    <div class="dash">
      <div class="kpi">
        <div class="klabel">MSISDN</div>
        <div class="kval" id="kMsisdn">—</div>
      </div>

      <div class="kpi">
        <div class="klabel">Pulsa</div>
        <div class="kval" id="kPulsa">—</div>
        <div class="klabel" id="kService">Serviceclass: —</div>
        <div class="pill">
          <span class="dot warn" id="statusDot"></span>
          <span id="kStatus">—</span>
        </div>
      </div>
    </div>

    <div class="resultWrap">
      <div class="resultHead"><span class="paper"></span> RESULT :</div>
      <div id="resultBox">
        <div class="empty">Masukkan nomor lalu klik <b>Cek Kuota</b>.</div>
      </div>
    </div>

  </div>
</div>

<script>
const input = document.getElementById("msisdn");
const btn = document.getElementById("cekBtn");
const resultBox = document.getElementById("resultBox");

const kMsisdn = document.getElementById("kMsisdn");
const kPulsa = document.getElementById("kPulsa");
const kService = document.getElementById("kService");
const kStatus = document.getElementById("kStatus");
const statusDot = document.getElementById("statusDot");

input.addEventListener("input", () => {
  input.value = (input.value || "").replace(/\D/g, "");
  btn.disabled = input.value.length < 8;
});

function setStatusPill(text){
  kStatus.textContent = text || "—";
  statusDot.classList.remove("ok","bad","warn");

  const st = (text || "").toLowerCase();
  if(st.includes("aktif")) statusDot.classList.add("ok");
  else if(text) statusDot.classList.add("bad");
  else statusDot.classList.add("warn");
}

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ✅ ACCORDION FIX:
   - default: semua tertutup
   - klik item yg sama: toggle buka/tutup
   - tidak auto-open */
function renderPackages(packages){
  resultBox.innerHTML = "";

  if(!Array.isArray(packages) || packages.length === 0){
    resultBox.innerHTML = `<div class="empty">Tidak ada paket terdeteksi.</div>`;
    return;
  }

  packages.forEach((pkg) => {
    const box = document.createElement("div");
    box.className = "pkg"; // ❌ tidak ada open default

    const items = Array.isArray(pkg.items) ? pkg.items : [];

    const itemsHtml = items.length
      ? items.map(it => `
          <div class="item">
            <div>
              <div class="iname">${escapeHtml(it.name || "-")}</div>
              <div class="iexp">Exp: ${escapeHtml(it.expired_at || "-")}</div>
            </div>
            <div class="irem">${escapeHtml(it.remaining_text || "-")}</div>
          </div>
        `).join("")
      : `<div class="empty">Tidak ada item.</div>`;

    box.innerHTML = `
      <div class="pkgHeader" role="button" tabindex="0">
        <div style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          ${escapeHtml(pkg.title || "Paket")}
        </div>
        <span class="chev">›</span>
      </div>
      <div class="pkgBody">${itemsHtml}</div>
    `;

    const header = box.querySelector(".pkgHeader");

    const toggle = () => {
      box.classList.toggle("open"); // ✅ klik lagi bisa nutup
    };

    header.addEventListener("click", toggle);
    header.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        toggle();
      }
    });

    resultBox.appendChild(box);
  });
}

function formatMsisdn(v){
  v = (v||"").replace(/\D/g,"");
  if(v.startsWith("0")) v = v.slice(1);
  if(!v.startsWith("62")) v = "62" + v;
  return v;
}

btn.addEventListener("click", async () => {
  const msisdn = formatMsisdn(input.value.trim());

  btn.disabled = true;
  btn.textContent = "Loading...";
  resultBox.innerHTML = `<div class="empty">Mengambil data...</div>`;
  setStatusPill("Loading...");

  try{
    const res = await fetch("https://misc-api.kmsp-store.com/simple-api/quota/v1/check",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ msisdn })
    });

    const json = await res.json();
    if(!json || json.status !== true || !json.data){
      throw new Error(json?.message || "Gagal ambil data");
    }

    const c = json.data.customer || {};
    const packages = Array.isArray(json.data.packages) ? json.data.packages : [];

    kMsisdn.textContent = c.msisdn || msisdn;
    kPulsa.textContent = c.balance?.text || "—";
    kService.textContent = "Serviceclass: " + (c.serviceclass || "—");
    setStatusPill(c.status || "—");

    renderPackages(packages);

  }catch(err){
    setStatusPill("Error");
    resultBox.innerHTML = `<div class="empty">Gagal cek kuota. Coba lagi.</div>`;
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = "Cek Kuota";
  }
});
</script>
</body>
</html>
